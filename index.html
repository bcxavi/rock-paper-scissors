<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
    <h1>Rock Paper Scissors</h1>

    <div class="score-board">
        <div class="score-box">
        <p class="label">Human</p>
        <p class="human-score">0</p>
        </div>

        <div class="score-box">
        <p class="label">Computer</p>
        <p class="computer-score">0</p>
        </div>
    </div>

    <p class="instruction">Choose your weapon!</p>

    <div class="buttons">
        <button class="choice-btn">Rock</button>
        <button class="choice-btn">Paper</button>
        <button class="choice-btn">Scissors</button>
    </div>

    <p class="result-message"></p>
    </main>

  <script src="script.js"></script>
</body>
</html>
